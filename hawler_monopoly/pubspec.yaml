name: hawler_monopoly
description: >
  مۆنۆپۆلی هەولێر — یارییەکی تەختەیی چندنەفەری بە کەلتووری کوردی و
  ڕازاوەیە بە ئاوازی شاری هەولێر. Pass & Play + AI + Online (Firebase).
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  animate_do: ^3.3.4
  confetti: ^0.7.0
  font_awesome_flutter: ^10.7.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  shared_preferences: ^2.5.2
  http: ^1.2.2
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # fonts:
  #   - family: NRT
  #     fonts:
  #       - asset: assets/fonts/NRT-Bold.ttf
  #         weight: 700
  #       - asset: assets/fonts/NRT-Regular.ttf
  #         weight: 400
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
